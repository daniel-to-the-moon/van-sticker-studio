# 发版验收冒烟（只读）＋ 自动上线 / 自动回滚
#
# smoke 任务：对一个已上传的 Worker 版本（预览 URL）跑 tools/release-acceptance.mjs，
# 结果写进 Job Summary 并存为 artifact。只做 GET，不调用真实生成、不读 Secret。
#
# deploy 任务（会切生产流量，默认关闭）：
# - 自动：main 上 Workers Builds 成功 → smoke 通过 → 发布闸门通过（目标=当前 main head、
#   gates 绿、生产 commit 可读、区间内改了可见文件的 PR 都带 visual-accepted 或
#   no-visual-change 标签）→ 100% 切到该版本 → 生产冒烟（--expect-commit）→
#   失败则一次性切回切换前的版本并再冒烟。仅当仓库变量 AUTO_DEPLOY == 'true' 时运行。
# - 手动：workflow_dispatch 勾选 promote 并填版本 ID，跳过标签闸门（视为维护者决定），
#   其余步骤（预览冒烟、生产冒烟、失败回滚）相同。
# 需要：secrets CLOUDFLARE_API_TOKEN（Workers Scripts:Edit）、CLOUDFLARE_ACCOUNT_ID；
# 可选：GitHub Environment `production` 加人工批准；vars.RELEASE_LOG_ISSUE（默认 107）。
# 每次切换、回滚、拦下都会在发布记录 issue 留一条评论。
#
# check_run 触发器只在本文件进入 main 后生效。分支预览的检查摘要不带 URL，自动跳过。

name: Release acceptance

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: '待验版本的 https 地址（版本预览或生产）'
        required: true
      expect_commit:
        description: '期望的构建 commit（手动发版时必填完整 40 位）'
        required: false
      label:
        description: '报告标题（可空）'
        required: false
      promote:
        description: '冒烟通过后把下面的版本切到 100% 生产流量'
        type: boolean
        default: false
      promote_version:
        description: '要上线的 Worker 版本 ID（UUID，见 Workers Builds 检查摘要）'
        required: false

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://mxgarage-wrap-studio.haburaaashi.workers.dev
  WORKER_NAME: mxgarage-wrap-studio

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.check_run.name, 'Workers Builds') &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.target.outputs.skip }}
      url: ${{ steps.target.outputs.url }}
      commit: ${{ steps.target.outputs.commit }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Resolve target
        id: target
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_COMMIT: ${{ inputs.expect_commit }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_VERSION: ${{ inputs.promote_version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            let url = process.env.INPUT_URL || "";
            let commit = process.env.INPUT_COMMIT || "";
            let label = process.env.INPUT_LABEL || "";
            let version = process.env.INPUT_VERSION || "";
            if (event.check_run) {
              const summary = String(event.check_run.output?.summary ?? "");
              const m = summary.match(/Preview URL:\s*\[?([^\s\])]+)/);
              url = m ? m[1] : "";
              commit = event.check_run.head_sha;
              const v = summary.match(/Version ID:\s*([0-9a-f-]+)/);
              version = v ? v[1] : "";
              label = `Workers Builds 版本 ${version || "未知"}（${commit.slice(0, 7)}）`;
            }
            if (event.check_run && !url) {
              console.log("::notice::Workers Builds summary has no Preview URL (branch preview); skipped");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
              process.exit(0);
            }
            if (!/^https:\/\/[A-Za-z0-9.-]+(\/.*)?$/.test(url)) { console.error("no usable https preview URL"); process.exit(1); }
            if (commit && !/^[0-9a-fA-F]{7,40}$/.test(commit)) { console.error("expect_commit must be hex"); process.exit(1); }
            if (version && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(version)) { console.error("version must be a UUID"); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\ncommit=${commit}\nversion=${version}\nlabel=${label.replace(/[\r\n]/g, " ")}\n`);
          '
      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          # 用期望 commit 的源码取 GLB 元数据做哈希链核对；无期望时用默认分支。
          ref: ${{ steps.target.outputs.commit || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: steps.target.outputs.skip != 'true'
        with:
          node-version: '22'
      - name: Smoke the target version
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          TARGET_LABEL: ${{ steps.target.outputs.label }}
        run: |
          set -o pipefail
          args=(--url "$TARGET_URL")
          [ -n "$TARGET_COMMIT" ] && args+=(--expect-commit "$TARGET_COMMIT")
          [ -n "$TARGET_LABEL" ] && args+=(--label "$TARGET_LABEL")
          node tools/release-acceptance.mjs "${args[@]}" | tee target.md
      - name: Record what production serves now (informational)
        if: always() && steps.target.outputs.skip != 'true'
        run: |
          node tools/release-acceptance.mjs --url "$PRODUCTION_URL" --label "当前生产（对照，不判定本次）" | tee production.md || true
      - name: Publish evidence
        if: always() && steps.target.outputs.skip != 'true'
        run: |
          {
            echo "源码 checkout：\`$(git rev-parse HEAD)\`，run：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            [ -f target.md ] && cat target.md
            echo
            [ -f production.md ] && cat production.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.target.outputs.skip != 'true'
        with:
          name: release-acceptance-${{ github.run_id }}
          path: |
            target.md
            production.md
          if-no-files-found: warn
          retention-days: 90

  deploy:
    needs: smoke
    if: >-
      needs.smoke.result == 'success' && needs.smoke.outputs.skip != 'true' &&
      ((github.event_name == 'check_run' &&
        github.event.check_run.check_suite.head_branch == 'main' &&
        vars.AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.promote))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: write
    env:
      COMMIT: ${{ needs.smoke.outputs.commit }}
      VERSION: ${{ needs.smoke.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      LOG_ISSUE: ${{ vars.RELEASE_LOG_ISSUE || '107' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check inputs
        run: |
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "需要完整 40 位目标 commit" | tee -a log.md; exit 1; }
          [ -n "$VERSION" ] || { echo "需要版本 ID" | tee -a log.md; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.smoke.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release gate (automatic runs only)
        if: github.event_name == 'check_run'
        run: |
          set -o pipefail
          node tools/production-deploy.mjs gate --target "$COMMIT" --prod-url "$PRODUCTION_URL" | tee gate.md
      - name: Remember the version serving production now
        id: prev
        run: |
          current=$(node tools/production-deploy.mjs current)
          echo "$current"
          echo "version=$(node -e 'console.log(JSON.parse(process.argv[1]).versionId)' "$current")" >> "$GITHUB_OUTPUT"
      - name: Promote to 100%
        id: promote
        if: steps.prev.outputs.version != env.VERSION
        run: |
          node tools/production-deploy.mjs promote --version "$VERSION" \
            --message "release-acceptance: ${COMMIT:0:7} via ${RUN_URL}"
      - name: Smoke production
        id: prodsmoke
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 20
            if node tools/release-acceptance.mjs --url "$PRODUCTION_URL" --expect-commit "$COMMIT" --label "上线后生产冒烟" > prod.md; then
              cat prod.md; exit 0
            fi
          done
          cat prod.md; exit 1
      - name: Roll back once to the previous version
        id: rollback
        if: steps.prodsmoke.outcome == 'failure' && steps.prev.outputs.version != ''
        env:
          PREV: ${{ steps.prev.outputs.version }}
        run: |
          node tools/production-deploy.mjs promote --version "$PREV" \
            --message "auto-rollback from ${COMMIT:0:7} via ${RUN_URL}"
          sleep 30
          node tools/release-acceptance.mjs --url "$PRODUCTION_URL" --label "回滚后生产冒烟" > rollback.md || true
          cat rollback.md
          exit 1
      - name: Fail the job when production smoke failed
        if: steps.prodsmoke.outcome == 'failure'
        run: exit 1
      - name: Write release log
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.version }}
          PROMOTE: ${{ steps.promote.outcome }}
          PRODSMOKE: ${{ steps.prodsmoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          if [ "$PROMOTE" = "skipped" ] && [ -n "$PREV" ] && [ "$PREV" = "$VERSION" ]; then verdict="生产已是该版本，未切换";
          elif [ "$PROMOTE" != "success" ]; then verdict="未上线（闸门拦下或切换失败）";
          elif [ "$PRODSMOKE" = "success" ]; then verdict="已上线，生产冒烟通过";
          elif [ "$ROLLBACK" = "failure" ] || [ "$ROLLBACK" = "success" ]; then verdict="上线后冒烟失败，已一次性回滚到 ${PREV}，请人工核实";
          else verdict="上线后冒烟失败，未能回滚，请人工处理"; fi
          {
            echo "执行者：Release acceptance 工作流（${GITHUB_EVENT_NAME}）｜${verdict}"
            echo
            echo "- 目标：commit \`${COMMIT}\`，版本 \`${VERSION}\`"
            echo "- 切换前生产版本：\`${PREV:-未知}\`"
            echo "- run：${RUN_URL}"
            for f in gate.md log.md prod.md rollback.md; do [ -f "$f" ] && { echo; cat "$f"; }; done
          } > release-log.md
          cat release-log.md >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${LOG_ISSUE}/comments" -F body=@release-log.md > /dev/null || echo "::warning::could not write release log comment"
