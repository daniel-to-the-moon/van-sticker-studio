# 独立性闸门（agent-governance-kit）
#
# 按 GitHub 身份（PR 作者、推送者、评审者、打标签者）判定：有非本体系对当前 head 的批准、
# 没有未撤回的“要求修改”、可见改动有维护者的验收标签。结果以闸门 App 的身份写成
# `independence-gate` 检查；规则集把该检查的来源限定为这个 App，PR 里的工作流伪造不了。
#
# 安全要点：
# - 只用 pull_request_target / workflow_run / issue_comment / workflow_dispatch 触发，
#   这些都从默认分支的工作流文件运行，PR 改不了本文件。
# - 只检出默认分支的闸门脚本与身份表，从不检出或执行 PR 代码。
# - 闸门 App 私钥放在 Environment `independence-gate`（部署分支仅限默认分支）。

name: independence-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [review-ping]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR 编号'
        required: true

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/gate'))
    # Job-level so that ordinary comments (job skipped) never cancel a running evaluation.
    concurrency:
      group: independence-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: independence-gate
    steps:
      - name: Which PR
        id: pr
        env:
          N: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
        run: |
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "::notice::no PR number in this event"; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "number=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            tools/independence-gate.mjs
            .github/agent-identities.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number != ''
        with:
          node-version: '22'
      - name: Gate App token
        id: token
        if: steps.pr.outputs.number != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
      - name: Evaluate and publish
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: node tools/independence-gate.mjs --pr "$PR" --publish | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail {0}
