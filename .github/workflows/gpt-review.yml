# GPT 独立复核（CI）：PR 有新提交、转 Ready 或手动触发时，在 GitHub Actions 里用 Codex（GPT 模型）对精确 head 做独立复核，
# 结论用 GitHub App mxgarage-vss-gpt 的身份发评论（#120，docs/process/gpt-ci-review.md）。
#
# 为什么在 CI 里：ChatGPT 对话里的 GPT（dot）无法被 GitHub 事件唤醒（AGENTS §11），每次都要维护者传话；
# 共享账号下也认不出评审者是谁。这里由事件触发，评论作者是 App 机器人账号，可以核验。
#
# 安全结构：
#   review：只读令牌。评审规则（提示词、schema、AGENTS / CONTRIBUTING / constitution）取自 main，放进可信目录作为 Codex 的工作目录；
#           PR 代码检出到另一个目录，只作为被评审的数据（PR 里改过的说明文件不会被当成指令加载）。
#           Codex 在只读沙箱里运行（permission-profile :read-only，safety-strategy 默认 drop-sudo）。
#   post  ：不检出、不执行 PR 代码；只用 App 安装令牌发评论，发之前核对 PR head 仍是被评审的那个提交。
# 默认停用：仓库变量 GPT_REVIEW_ENABLED=true 才运行。第三方 action 均固定到完整提交 SHA（注释里是对应的标签）。
# devloop 用 GITHUB_TOKEN 开的 PR 不会触发 pull_request 事件，由 devloop 的 publish 用 workflow_dispatch 触发本工作流。
name: gpt-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: '要评审的 PR 编号'
        required: true

permissions: {}

concurrency:
  group: gpt-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.GPT_REVIEW_ENABLED == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    outputs:
      head: ${{ steps.prep.outputs.head }}
      rules: ${{ steps.prep.outputs.rules }}
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      # 评审规则与脚本取自 main（可信），不用 PR 里的版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: _rules
          sparse-checkout: |
            .github/gpt-review
            scripts/gpt-review
            AGENTS.md
            CONTRIBUTING.md
            constitution.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 准备可信目录（提示词、schema、main 上的规则）与 PR 上下文
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          RULES_SRC: ${{ github.workspace }}/_rules
          DEST: ${{ runner.temp }}/gpt-review
          PR_DIR: ${{ github.workspace }}/pr
        run: bash _rules/scripts/gpt-review/prepare.sh
      # 检出被评审的精确 head（完整 SHA），只作为数据
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.prep.outputs.head }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: 核对检出的 head
        env:
          HEAD_SHA: ${{ steps.prep.outputs.head }}
        run: '[ "$(git -C pr rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error::检出的不是要评审的 head" >&2; exit 1; }'
      - uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/gpt-review/prompt.md
          output-schema-file: ${{ runner.temp }}/gpt-review/schema.json
          # 可信目录（不是 git 仓库）作为工作目录：只有 main 上的规则会被当成项目说明
          working-directory: ${{ runner.temp }}/gpt-review
          codex-args: '["--skip-git-repo-check"]'
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          model: ${{ vars.GPT_REVIEW_MODEL }}
          # devloop 发布后用 GITHUB_TOKEN 手动触发时发起者是 github-actions[bot]；只对手动触发放行
          allow-bots: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

  post:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 评论用 App 的身份发（mxgarage-vss-gpt[bot]），不用共享的维护者账号，也不用 github-actions
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.GPT_REVIEW_APP_ID }}
          private-key: ${{ secrets.GPT_REVIEW_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: _rules
          sparse-checkout: scripts/gpt-review
          persist-credentials: false
      - name: 发布评审结论
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD: ${{ needs.review.outputs.head }}
          RULES: ${{ needs.review.outputs.rules }}
          RESULT: ${{ needs.review.outputs.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$RESULT" > "$RUNNER_TEMP/result.json"
          RESULT_FILE="$RUNNER_TEMP/result.json" bash _rules/scripts/gpt-review/post.sh
